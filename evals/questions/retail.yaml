# Question evals (AI_DESIGN Task D) on the seeded Fernwood demo data, today = 2026-10-13.
# Each `query` case is scored by RESULT: its answer must give the same numbers as `ref` (a question
# spec; missing parts default to no breakdown, no filters, all time). `demo: true` marks the investor
# demo script subset. `after` names the question asked just before in the same conversation.

# --- Demo script (DEMO_SCRIPT.md) ---------------------------------------------------------------
- id: demo-profit-products
  q: Which products made me the most profit last month?
  expect: query
  demo: true
  ref:
    {
      metrics: [gross_profit],
      dimensions: [{ field: product.name }],
      timeRange: { preset: last_month },
      orderBy: { by: gross_profit, dir: desc },
      limit: 10,
    }
- id: demo-best-customers
  q: Who are my best customers?
  expect: clarify
  demo: true
- id: demo-sales-last-month
  q: How much did I sell last month?
  expect: query
  demo: true
  ref: { metrics: [net_sales], timeRange: { preset: last_month } }
- id: demo-run-out
  q: What's about to run out?
  expect: query
  demo: true
  ref:
    {
      metrics: [days_of_cover],
      dimensions: [{ field: product.name }],
      orderBy: { by: days_of_cover, dir: asc },
      limit: 10,
    }
- id: demo-stopped-ordering
  q: Which customers stopped ordering?
  expect: query
  demo: true
  ref:
    {
      metrics: [lapsed_customers],
      dimensions: [{ field: customer.name }],
      having: [{ metric: lapsed_customers, op: gt, value: 0 }],
    }
- id: demo-sales-by-channel-month
  q: Show me sales by channel by month
  expect: query
  demo: true
  ref: { metrics: [net_sales], dimensions: [{ time: month }, { field: sale.channel }] }
- id: demo-owes-me
  q: Who owes me money?
  expect: query
  demo: true
  ref:
    {
      metrics: [outstanding_receivables],
      dimensions: [{ field: customer.name }],
      having: [{ metric: outstanding_receivables, op: gt, value: 0 }],
    }
- id: demo-tied-up-stock
  q: How much money is tied up in stock?
  expect: query
  demo: true
  ref: { metrics: [stock_value] }
- id: demo-not-selling
  q: What's not selling?
  expect: query
  demo: true
  ref:
    {
      metrics: [dead_stock_value],
      dimensions: [{ field: product.name }],
      having: [{ metric: dead_stock_value, op: gt, value: 0 }],
    }
- id: demo-etsy-best-seller
  q: What's my best seller on Etsy?
  expect: query
  demo: true
  ref:
    {
      metrics: [net_sales],
      dimensions: [{ field: product.name }],
      filters: [{ field: sale.channel, op: eq, values: [etsy] }],
      orderBy: { by: net_sales, dir: desc },
      limit: 10,
    }

# --- Pack example questions (VERTICAL_PACKS §2.8) -----------------------------------------------
- id: ex-channel-growing
  q: Which channel is growing fastest?
  expect: query
  ref:
    {
      metrics: [net_sales],
      dimensions: [{ field: sale.channel }],
      timeRange: { preset: last_90_days },
      compareTo: previous_period,
    }
- id: ex-sales-by-week
  q: Show sales by week this year.
  expect: query
  ref: { metrics: [net_sales], dimensions: [{ time: week }], timeRange: { preset: this_year } }
- id: ex-best-margins
  q: Which products have the best margins?
  expect: query
  ref:
    {
      metrics: [gross_margin_pct],
      dimensions: [{ field: product.name }],
      orderBy: { by: gross_margin_pct, dir: desc },
      limit: 10,
    }
- id: ex-reorder
  q: What should I reorder this week?
  expect: query
  ref:
    {
      metrics: [days_of_cover],
      dimensions: [{ field: product.name }],
      orderBy: { by: days_of_cover, dir: asc },
      limit: 10,
    }
- id: ex-top-customers
  q: Who are my top customers?
  expect: clarify
- id: ex-new-customers
  q: How many new customers did I get this month?
  expect: query
  ref: { metrics: [new_customers], timeRange: { preset: this_month } }
- id: ex-come-back
  q: What share of customers come back?
  expect: query
  ref: { metrics: [repeat_customer_rate], timeRange: { preset: this_year } }
- id: ex-ads
  q: What did I spend on ads this year?
  expect: query
  ref:
    {
      metrics: [expenses_total],
      filters: [{ field: expense.category, op: contains, values: [advertising] }],
      timeRange: { preset: this_year },
    }
- id: ex-profit-after-expenses
  q: What's my profit after expenses this quarter?
  expect: query
  ref: { metrics: [net_profit_estimate], timeRange: { preset: this_quarter } }
- id: ex-best-days
  q: What were my best days of the week?
  expect: query
  note: Needs weekdays, which the spec can't express; rules hand it over (SQL fallback with AI).
  ref: { metrics: [net_sales], dimensions: [{ time: day }] }

