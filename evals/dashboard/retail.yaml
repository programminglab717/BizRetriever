  request: add something nice
  expect: none

# --- Harder wording (mostly for the AI) ---------------------------------------------------------
- id: hard-swap
  request: I don't need the slow-moving stock list any more
  expect: plan
  ops: [{ op: remove_tile, tile: slow_stock }]
- id: hard-add-wholesale
  request: Could I see how much each wholesale customer has spent?
  expect: plan
  ops:
    - op: add_tile
      ref:
        {
          metrics: [net_sales],
          dimensions: [{ field: customer.name }],
          filters: [{ field: sale.channel, op: eq, values: [wholesale] }],
        }
- id: hard-bigger
  request: make the sales over time chart bigger
  expect: plan
  ops: [{ op: update_tile, tile: sales_over_time, size: true }]
