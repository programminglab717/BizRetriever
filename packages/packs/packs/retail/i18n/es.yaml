  - { group: Inventario, text: ¿Qué debería reponer esta semana?, needs: [days_of_cover] }
  - { group: Clientes, text: ¿Quiénes son mis mejores clientes?, needs: [net_sales] }
  - { group: Clientes, text: ¿Qué clientes dejaron de comprar?, needs: [lapsed_customers] }
  - { group: Clientes, text: ¿Cuántos clientes nuevos conseguí este mes?, needs: [new_customers] }
